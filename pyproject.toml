[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "domtrack"
version = "0.0.1"
description = "Record DOM mutations and user events from a live page, then replay them with Playwright."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MhkaPR" }]
keywords = ["dom", "mutation-observer", "rrweb", "playwright", "replay", "scraping"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = ["playwright>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=7"]
tables = ["rich>=13", "tabulate>=0.9"]
llm = ["openai>=1.0"]
llm-anthropic = ["anthropic>=0.40"]
all = ["rich>=13", "tabulate>=0.9", "openai>=1.0", "anthropic>=0.40"]

[project.urls]
Homepage = "https://github.com/MhkaPR/domtrack"
Repository = "https://github.com/MhkaPR/domtrack.git"

[project.scripts]
domtrack = "domtrack.cli:main"
domtrack-capture = "domtrack.capture.cli:main"
domtrack-replay = "domtrack.replay.cli:main"
domtrack-html = "domtrack.html.cli:main"
domtrack-diff = "domtrack.diff.cli:main"
domtrack-compare = "domtrack.compare.cli:main"
domtrack-tables = "domtrack.tables.cli:main"

[tool.setuptools.packages.find]
include = ["domtrack*"]

[tool.setuptools.package-data]
domtrack = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
